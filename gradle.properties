# Gradle
# This box has 13GB RAM shared with other services (see ONDO_PORT_STATUS.md /
# /home/nicknas/wavio/apps/mobile/android/gradle.properties for the same pattern).
# Keep these capped and the daemon off — uncapped runs have OOM-killed before.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=false
org.gradle.configuration-cache.problems=warn
org.gradle.configureondemand=true
org.gradle.parallel=false
org.gradle.tooling.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.workers.max=1

# Kotlin
kotlin.code.style=official
kotlin.suppressGradlePluginWarnings=NonKmpAgpIsDeprecated
kotlin.incremental.native=true
kotlin.native.binary.smallBinary=true
kotlin.native.ignoreDisabledTargets=true
# kotlin.daemon.jvmargs was NOT being honoured by this KMP toolchain: a previous
# run left an orphaned KotlinCompileDaemon at -Xmx8g -Xms8g (KGP's own fallback
# default), which is what has OOM-killed builds on this 13GB box. Rather than
# fight KGP over daemon args, run the Kotlin compiler *inside* the Gradle process
# so the only heap cap that matters is org.gradle.jvmargs above. Verify with
# `pgrep -af KotlinCompileDaemon` -- it must print nothing during a build.
kotlin.compiler.execution.strategy=in-process
# Belt-and-braces: if anything still forks a daemon (e.g. a task that ignores the
# strategy), cap it rather than letting the 8g default through.
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
# Kotlin/Native's compiler runs its own JVM with a separate, also-uncapped default.
kotlin.native.jvmArgs=-Xmx1024m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false
