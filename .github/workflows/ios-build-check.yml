# Ondo iOS build check on a GitHub macOS runner. No signing, no secrets.
# Copy to ondo-ios/.github/workflows/ios-build-check.yml. Runs on push and by hand (Actions tab -> Run workflow).
# Gives you the Kotlin link + Xcode errors directly, so the fix loop does not wait on the Mac.
#
# Check the two names against the repo before the first run:
#   Builds the shared iosApp scheme, the same one the TestFlight archive uses.
#   Gradle module is :composeApp (framework baseName ComposeApp).
name: ios-build-check

# Public repo, so macOS minutes are free: check every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-check-${{ github.ref }}
  # Never cancel a main run part-way (it kills the Gradle/Konan cache save); other refs can.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODE_PROJECT: iosApp/iosApp.xcodeproj
  XCODE_SCHEME: iosApp

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Pick newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Link Kotlin framework (simulator, arm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Xcode build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E 'error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
